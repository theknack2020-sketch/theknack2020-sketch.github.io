<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Caliper — a pocket precision toolbox: level, ruler, angle finder and sound check.">
<title>Caliper — TheKnack</title>
<style>
  :root { --bg:#DFDBD2; --fg:#26231C; --muted:#524E44; --accent:#8F3D00;
          --card:#E8E4DB; --border:rgba(38,35,28,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#201D18; --fg:#EAE5DA; --muted:#A39C8E; --accent:#FF9950;
            --card:#2A2620; --border:rgba(234,229,218,.16); } }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--fg); line-height:1.62; margin:0; padding:3rem 1.25rem 4rem; }
  main { max-width:40rem; margin:0 auto; }
  .kicker { font-size:.75rem; letter-spacing:.18em; text-transform:uppercase;
            color:var(--accent); font-weight:600; }
  h1 { font-size:2.1rem; margin:.4rem 0 .5rem; }
  p.lead { color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; padding:0; }
  li { margin:.6rem 0; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  hr { border:0; border-top:1px solid var(--border); margin:2.5rem 0 1.25rem; }
  footer { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
<div class="kicker">TheKnack</div>
<h1>Caliper</h1>
<p class="lead">A pocket precision toolbox — level, ruler, angle finder and sound check,
with guided jobs and a measurement log. No ads, no tracking, nothing leaves the phone.</p>
<ul>
  <li><a href="support.html">Support</a></li>
  <li><a href="privacy-policy.html">Privacy Policy</a></li>
  <li><a href="terms-of-use.html">Terms of Use</a></li>
</ul>
<hr>
<footer>© 2026 TheKnack</footer>
</main>
</body>
</html>
